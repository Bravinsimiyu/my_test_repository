plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'my.test.project.App'
}

tasks.named('test') {
    useJUnitPlatform()
}

// FIXED: Forces Gradle to build into a stable, non-variable path
tasks.named('installDist') {
    into layout.buildDirectory.dir("install/dist")
}
