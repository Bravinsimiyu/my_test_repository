name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up the Java environment (Updated to JDK 21)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Optimize and cache Gradle dependencies
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Grant execute permission to Gradle Wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Build the application JAR file
    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # 6. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 7. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 8. Extract automated version tags
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/java_gradle_demo
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 9. Build the image and push to Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
