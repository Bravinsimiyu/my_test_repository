name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository files
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Initialize Docker Buildx environment engine
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Securely authenticate with Docker Hub using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Extract automated metadata version tags
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/java_gradle_demo
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 5. Build the image and push to Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      env:
        BUILDKIT_PROGRESS: plain
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
