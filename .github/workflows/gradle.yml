# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow will build a Java project with Gradle and cache/restore
# any dependencies to improve the workflow execution time.
#
# It will also build a Docker image and push it to Docker Hub when
# changes are pushed to the main branch.
#
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

    # Check out the repository so the workflow can access
    # the Java source code, Gradle files, and Dockerfile.
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install JDK 17 so the Java project can be compiled and tested.
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Grant execute permission to the Gradle Wrapper.
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Configure Gradle for optimal use in GitHub Actions,
    # including caching of downloaded dependencies.
    #
    # See:
    # https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # Build the Java application using the Gradle Wrapper.
    # The generated JAR will be placed in build/libs/.
    - name: Build with Gradle Wrapper
      run: ./gradlew clean build

    # Copy the generated JAR to a predictable filename.
    # This allows the Dockerfile to use the same filename
    # regardless of the project's Gradle version or JAR version.
    - name: Prepare Docker build
      run: cp build/libs/*.jar app.jar

    # Log in to Docker Hub using credentials stored as
    # GitHub repository secrets.
    #
    # DOCKER_USERNAME contains the Docker Hub username.
    # DOCKER_PASSWORD contains the Docker Hub access token.
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Set up Docker Buildx, which provides the Docker builder
    # used by the Docker build and push action.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build the Docker image using the Dockerfile in the repository.
    #
    # The image is pushed to Docker Hub only when the workflow
    # is triggered by a push event.
    #
    # For pull requests, the image is built but not pushed.
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: bravinwasike/java_gradle_demo:latest

    # NOTE: The Gradle Wrapper is the default and recommended way
    # to run Gradle.
    #
    # If your project does not have the Gradle Wrapper configured,
    # you can use the following configuration to install a specific
    # Gradle version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build
